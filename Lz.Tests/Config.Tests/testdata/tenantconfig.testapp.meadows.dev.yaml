RootDomain: "testdev.click"
TenantSuffix: "496a-aaaa"
Profile: "testapp-dev"
Region: "us-west-2"

SecretsManager:
  SecretPrefix: "testapp/meadows"
  VerboseLogging: false

Integrations:
  Services:
    store:
      Deployment: "cloud"
      Host: "shop.testdev.click"
      DockerName: "smartstore"
      Scheme: "https"
      Description: "SmartStore e-commerce platform"
      Modules:
        - ShopModule
        - ShopRestModule
    auth:
      Deployment: "all"
      Host: "auth.testdev.click"
      DockerName: "keycloak"
      Scheme: "https"
      Description: "Keycloak authentication server"

# AuthConfigs block omitted: pool declarations live on systemconfig only.

DefaultTenant: "testdev.click"

ECS:
  LogRetentionDays: 3
  EnableEfsMountInstance: true
  SmartStoreCpu: 512
  SmartStoreMemory: 1024
  AppHostCpu: 256
  AppHostMemory: 512
  ServiceDesiredCount: 1

CDN:
  PriceClass: PriceClass_100
  DefaultRootObject: app/index.html
