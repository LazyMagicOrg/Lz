# CI gate for Lz. Runs the two suites this repo owns: the Cognito Custom-Auth trigger's pure
# decision core (node:test) and the Lz config/merge/validators + policy + smoke-probe logic (xUnit).
#
# WHY THIS LOOKS MORE INVOLVED THAN "dotnet test". Three facts, each of which broke this workflow
# before (it was disabled_manually on 2026-08-22 after ~10 red runs, and stayed dark for two weeks):
#
#  1. Lz.slnx deliberately includes ProjectTemplates/* so template contamination (dangling
#     ProjectReferences) is caught at build time. Seven of those templates PackageReference
#     LazyMagic.* — so "no LazyMagic build is needed", which the old header asserted, was false for
#     the solution even though it is true for Lz.Core/Lz.Aws alone.
#  2. LazyMagic is not on nuget.org (search API: zero hits). It is published to GitHub Packages under
#     LazyMagicOrg, which needs a token; the repo is public, so BUILDING it needs none. We build it,
#     which is also what service-ci.yml does for the same reason.
#  3. TeardownRedeployTests is a live AWS lifecycle drill. It is gated behind LZ_LIFECYCLE_ENABLE=1,
#     but its harness constructor walks up looking for a systemconfig.{sk}.{env}.yaml BEFORE that
#     guard runs — that file exists only inside a workspace, never in a standalone clone, so the
#     constructor throws here. It carries Category=Integration and is filtered out, matching the
#     convention service-ci.yml already uses.
#
# The whole recipe was verified against a clean clone before being committed. The count has moved
# with the suite: 353/353 then, 577/577 now, the latter measured on Linux in
# mcr.microsoft.com/dotnet/sdk:10.0.301 before this job moved off windows-latest.
name: lz-ci

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest since 2026-09-07. This job ran on windows-latest for two stated reasons and
    # NEITHER survived measurement; both were true when written and had quietly stopped being true.
    #
    #  1. "An ubuntu run fails two DevEnvironmentGuardTests cases." It does not, at HEAD. Every case
    #     replayed on Linux passes. Both mechanisms were fixed in code the same morning that comment
    #     was committed, so it was stale on arrival — and only ONE of the two ever lived in that
    #     suite. The other was in CloneReposLogicTests, and it was not a test-data artefact at all
    #     but a real off-Windows security hole: on Linux a manifest path of `C:/Windows` was
    #     accepted and clonerepos would create a directory literally named `C:`. Fixed in aa732ce.
    #  2. "Those projects pull ReactiveUI/Splat, whose signing certificate is REVOKED — NU3012 on a
    #     Linux runner." The revocation was real (and Windows silently does not fail on it), but two
    #     things settle it: the five service projects this job builds restore clean on Linux
    #     unbumped, so the NARROWING below was doing all the work and the runner none of it; and
    #     ReactiveUI moved 23.2.19 -> 23.2.28 on 2026-09-07, off the revoked certificate entirely.
    #
    # MOVING HERE MAKES ONE TEST STRONGER, which is the part worth keeping. aa732ce's regression
    # test deliberately asserts the extracted HasDriveDesignator predicate rather than the
    # end-to-end guard, because on Windows `Path.IsPathRooted` rejects every drive form anyway, so
    # an end-to-end assertion passed with or without the check. On Linux it does NOT reject them —
    # only the explicit check does. So the end-to-end path is now genuinely load-bearing here.
    #
    # `lz` remains a Windows developer CLI and the suite still encodes Windows-shaped path data on
    # purpose; that is a fact about the DATA, not about the host, which is exactly what the pin
    # confused. Verified before flipping: the whole job replayed in
    # mcr.microsoft.com/dotnet/sdk:10.0.301 against a CI-shaped assembled root, 577 passed / 0
    # failed — not just the two suites named above. macOS is inferred from Linux, not measured.
    runs-on: ubuntu-latest
    steps:
      # repos/Lz + repos/LazyMagic under a workspace root — the EXACT shape a product workspace
      # has, and that is load-bearing rather than cosmetic. The local lane (below) writes its
      # override at the workspace root, and ProjectTemplates/Directory.Packages.props imports it
      # three levels up. Checked out flat as Lz/ and LazyMagic/, that import resolves ABOVE the
      # runner root and silently finds nothing - restore still succeeds, on the stale committed
      # defaults. Keeping CI's layout identical to a developer's is what makes the same override
      # path correct in both.
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 for the same reason the LazyMagic checkout below carries it - since
          # 2026-09-06 Lz derives its OWN version from version.json plus commit height, and a
          # depth-1 clone has no history to count. NBGV fails MSB4018 on a shallow clone rather
          # than guessing, so this is a hard stop, not a silent wrong number.
          fetch-depth: 0
          path: repos/Lz
      # Public repo: no token needed.
      #
      # ref: dev is REQUIRED, not a preference — it is the branch every workspace consumes, and
      # the one the templates are validated against. main and test lag it.
      #
      # fetch-depth: 0 is equally REQUIRED. Since 2026-09-06 LazyMagic derives its version from
      # version.json plus COMMIT HEIGHT (Nerdbank.GitVersioning), and a depth-1 checkout has no
      # history to count. That case is at least LOUD — measured on a real depth-1 clone against the
      # pinned 3.10.94, NBGV throws "Shallow clone lacks the objects required to calculate version
      # height" and fails the build with MSB4018, so it can never quietly ship a wrong number.
      # The genuinely silent case is the one guarded below: no version.json at all.
      #
      # WHAT USED TO BE COUPLED HERE, and no longer is: the templates pinned LazyMagic at an exact
      # literal, so any bump reddened this gate until someone edited the pins. Under a derived
      # version that is unfixable rather than tedious — every LazyMagic commit changes the version,
      # so no committed literal can ever track it. The lane step below pins the templates at
      # whatever was actually built instead.
      - uses: actions/checkout@v4
        with:
          repository: LazyMagicOrg/LazyMagic
          ref: dev
          fetch-depth: 0
          path: repos/LazyMagic

      # THE FAILURE THIS CATCHES IS SILENT, WHICH IS WHY IT IS A STEP AND NOT A COMMENT.
      # We check out LazyMagic's REMOTE dev. If that branch does not carry version.json — it was
      # reverted, the derived-versioning work landed on main while dev stayed static, or this
      # workflow was pushed BEFORE the LazyMagic commit — then NBGV is not in the build at all.
      # There is no error: the old static <Version> is used, the lane writes exactly the versions
      # the templates already have committed, restore is satisfied, and this gate goes GREEN
      # having exercised none of the thing it exists to exercise. A green run cannot discriminate,
      # because the lane pins whatever was built and the outcome is byte-identical either way.
      #
      # Deliberately asserts PRESENCE, not a version number. Naming the expected version here
      # would reintroduce the committed literal this whole change exists to remove, and would need
      # editing every time ProjectTemplates/Directory.Packages.props moves.
      - name: the LazyMagic checkout must be the derived-version one
        shell: pwsh
        run: |
          if (-not (Test-Path repos/LazyMagic/version.json)) {
            throw "LazyMagic dev carries no version.json, so this run would build the old static version and prove nothing about the package lane. Push the LazyMagic derived-versioning commit first."
          }

      - uses: actions/setup-dotnet@v4
        with:
          # global-json-file, not a floating dotnet-version: this repo pins an exact SDK with
          # rollForward: disable, so "10.0.x" would install whatever is newest and then be REJECTED
          # by that pin. repos/Lz's copy rather than the root's, because the root file is written
          # by a later step - they name the same version, and the assertion below pins them together
          # so they cannot drift apart silently.
          global-json-file: repos/Lz/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cognito Custom-Auth trigger — the fail-closed / single-shot / constant-time decision core.
      # Path note: this lives under Lz.Aws/Auth/, NOT Lz.Aws/AppRunner/ — the 0.11.0 axis restructure
      # (40c5517) retired the AppRunner topology and moved it. Because a failing step aborts the job,
      # naming the old path silently took `dotnet test` below down with it.
      - run: node --test repos/Lz/Lz.Aws/Auth/CognitoCustomAuth/custom-auth.test.mjs

      # Build ONLY the five service-side projects the templates pin, not LazyMagic.sln.
      #
      # Two reasons, and the second is not optional. (a) The whole solution also contains the
      # client-side projects (LazyMagic.OIDC.Base, LazyMagic.Client.ViewModels, BlazorTest.*), which
      # nothing here consumes. (b) Those projects pull ReactiveUI/Splat 19.3.1, whose author signing
      # certificate has been REVOKED. That was observed here as a hard NU3012 restore failure on a
      # Linux runner ("The author primary signature found a chain building issue: Revoked:
      # certificate revoked") before this job moved to windows-latest, where revocation checking
      # behaves differently. Building the five keeps that whole class of failure out of the gate
      # regardless of runner, and without weakening signature verification — the alternative,
      # NUGET_CERT_REVOCATION_MODE=offline, turns the check off globally.
      #
      # Per-project builds work because LazyMagic has a Directory.Build.props; Lz itself does not,
      # which is why IT must be built through the .slnx (MSB4019).
      # -p:PublicRelease=false is NOT redundant with LazyMagic's publicReleaseRefSpec, which is
      # main-only. That spec matches the AMBIENT ref, not the branch of the repo being built:
      # NBGV's cloud-build integration reads GITHUB_REF, and in this job GITHUB_REF is the LZ
      # repo's push (refs/heads/main). So LazyMagic - checked out at dev - was stamped a public
      # release of a branch it is not on. Measured on the first green run: it packed 3.0.22 with
      # no -g<sha>; reproduced locally by setting GITHUB_REF=refs/heads/main against a dev clone.
      #
      # Nothing is published from here, so no wrong package can reach a registry today. What the
      # flag prevents is a name collision waiting to happen: the version minted here is the same
      # string a genuine main publish at the same height would mint, from different content. With
      # the flag these throwaway packages always carry -g<sha> and can never be mistaken for one.
      - name: build LazyMagic service packages (the feed the templates restore from)
        shell: bash
        run: |
          for p in LazyMagic.Shared \
                   LazyMagic.Service.Shared \
                   LazyMagic.Service.Authorization \
                   LazyMagic.Service.DynamoDBRepo \
                   LazyMagic.Service.AwsLocalWebApiRoutingMiddleware; do
            dotnet build "repos/LazyMagic/$p/$p.csproj" -c Debug -p:PublicRelease=false
          done
          ls -1 repos/LazyMagic/Packages/*.nupkg

      # CI-only, deliberately NOT committed, and at the WORKSPACE ROOT rather than inside Lz.
      # A NuGet.Config inside a sub-repo is a documented hazard in this codebase: NuGet dedupes
      # sources by resolved PATH and the nearest config wins the NAME, so a sub-repo config can
      # silently rename a feed out from under a parent's packageSourceMapping. Writing it at the
      # root is both the safe side of that hazard and where a real workspace keeps it — and the
      # lane tool below reads the feed list from this same file, so the tool and restore cannot
      # disagree about which feeds exist. <clear/> drops the runner's inherited sources.
      # global.json AT THE ROOT, not just in the checked-out repos. Measured: the SDK is chosen by
      # the WORKING DIRECTORY, not the project directory - so repos/Lz/global.json binds only for
      # steps whose cwd is inside that repo. The lane step below runs from here, and without this
      # file it used the runner's preinstalled 10.0.400 while the test step used the pinned 10.0.301
      # - two SDKs in one job, which is exactly what pinning exists to prevent. The real workspace
      # root carries this file for the same reason; CI assembles the same shape.
      # THIS STEP MUST STAY AFTER THE LAZYMAGIC BUILD ABOVE. The config below declares
      # repos/LazyMagic/Packages as a source, and that directory is gitignored - it does not exist
      # in a fresh checkout, it is CREATED by the build. NuGet does not treat a declared-but-absent
      # local source as an empty feed; it fails restore outright with NU1301 "The local source ...
      # doesn't exist". Reordering these two steps for tidiness breaks every subsequent restore, on
      # any platform. Hit twice while replaying this job locally, which is the only reason it is
      # written down.
      - name: write the CI global.json and NuGet.Config
        shell: bash
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "10.0.301",
              "rollForward": "disable"
            }
          }
          JSON
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="LazyMagicLocal" value="repos/LazyMagic/Packages" />
            </packageSources>
          </configuration>
          XML

      # Pin the templates at the LazyMagic just built, instead of at a literal that cannot track a
      # derived version. This is the same local lane a developer's build.ps1 uses, driven the same
      # way: the tool scans the feeds named in the NuGet.Config above and writes one property per
      # package id into Packages.Local.props at the workspace root, which
      # ProjectTemplates/Directory.Packages.props imports beneath its committed defaults.
      #
      # Run from SOURCE rather than as the `lz` CLI: `lz` resolves Lz.Cli out of repos/Lz/Packages,
      # which does not exist on a fresh runner. Lz.Cli can be run from source precisely because it
      # takes nothing from a first-party feed — only sibling ProjectReferences and System.CommandLine.
      #
      # -p:SolutionDir is mandatory, not tidiness: Lz's projects import
      # $(SolutionDir)CommonPackageHandling.targets and this repo has no Directory.Build.props to
      # supply it, so a per-project build fails MSB4019. The .slnx sets it, a bare csproj does not.
      #
      # The tool REFUSES to write an empty override, so a LazyMagic build that silently produced
      # nothing fails here, loudly, instead of falling through to the stale defaults and testing
      # the wrong framework.
      - name: pin the templates at the LazyMagic just built (local lane)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          dotnet run --project repos/Lz/Lz.Cli/Lz.Cli.csproj -c Debug "-p:SolutionDir=$root/repos/Lz/" -- packages mode local --root "$root"
          if ($LASTEXITCODE -ne 0) { throw "lane refresh failed - templates would restore stale pins" }
          Get-Content Packages.Local.props

      # THE PUBLISH GUARD, EXERCISED IN ITS REFUSING DIRECTION ON EVERY PUSH.
      #
      # Nothing is published from this job, so this is not protecting a push — it is the liveness
      # proof for a guard whose real call site does not exist yet (the publish workflows are blocked
      # on the LazyMagic dev→main merge). A guard that is only unit-tested is one refactor away from
      # being unreachable, and the LazyMagic packages sitting in the feed above are exactly the state
      # it exists to refuse: built from `dev` with -p:PublicRelease=false, so every one carries NBGV's
      # -g<sha> discriminator.
      #
      # ASSERTING THE REFUSAL, not merely calling the guard, is what makes one step catch two
      # different regressions: a guard that stops recognising the discriminator, and a build that
      # stops passing -p:PublicRelease=false. The second is the trap documented above — NBGV reads
      # the AMBIENT GITHUB_REF, which here is Lz's own push, so without that flag LazyMagic gets
      # stamped a public release of a branch it is not on, minting the same version string a genuine
      # main publish would mint from different content. Drop the flag and these packages come out
      # clean, the guard says "ok", and this step goes red.
      #
      # The exit code alone would not discriminate: `dotnet run` also exits non-zero when the BUILD
      # fails, which would read as "the guard refused" and pass. So the output has to say so too.
      #
      # THIS STEP INVERTS THE USUAL CONTRACT — the command it runs is SUPPOSED to fail — so it has
      # to declare its own success explicitly. GitHub's pwsh shell appends `exit $LASTEXITCODE` to
      # the script, and $LASTEXITCODE is still 1 from the `dotnet run` above, so without the final
      # `exit 0` the step fails having proved exactly what it set out to prove. Observed on the first
      # run (34146393012): all three assertions passed, "5 of 5 package(s) REFUSED", step red. The
      # `exit 0` is safe because pwsh runs with $ErrorActionPreference=stop here, so any `throw`
      # above terminates the script and never reaches it.
      - name: the publish guard must refuse a non-public build
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $out = dotnet run --project repos/Lz/Lz.Cli/Lz.Cli.csproj -c Debug "-p:SolutionDir=$root/repos/Lz/" -- packages check --packages "$root/repos/LazyMagic/Packages" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw "The publish guard CLEARED packages built with -p:PublicRelease=false. Either the guard no longer recognises NBGV's commit-id discriminator, or the LazyMagic build above stopped passing that flag." }
          if ($out -notmatch 'NotAPublicRelease') { throw "packages check exited $code without reaching a verdict - that is a build or argument failure, not a refusal." }
          if ($out -notmatch 'packages check: (\d+) of \1 package\(s\) REFUSED') { throw "the guard refused only some of the packages; all of them were built non-public, so all of them should be refused." }
          Write-Host "the publish guard refused every non-public package, as it must."
          exit 0

      # Build via the SOLUTION — Lz.slnx sets SolutionDir; a bare-csproj build fails MSB4019.
      #
      # LZ_TARGETS_COPIES_ABSENT DECLARES THIS RUN'S REDUCED COVERAGE, and is required rather than
      # decorative. PackagingTargetsReplicationTests checks the four hand-replicated copies of the
      # packaging targets — Lz, LazyMagic, Service, BaseAppLib — and this job checks out only the
      # first two: Service and BaseAppLib are PRIVATE Scutara repos and this workflow runs in
      # LazyMagicOrg, which holds no credential for them (the scutara-ci App is registered "Only on
      # this account"; every cross-org checkout above is public and needs no token). Getting them
      # here would mean putting that App's private key on a public repo, which is not worth widening
      # a text assertion from two files to four.
      #
      # Until 2026-09-07 that gap was INVISIBLE: the theory's data source yielded only files that
      # existed, so this job ran 2 cases where a local run ran 4, with no skips and a green tick —
      # the whole 4-test difference between 570 locally and 566 here. Naming the gap makes it a
      # reviewed line instead of an accident, and the check runs in both directions: an absence that
      # is NOT named here fails the suite, and a name listed here whose repo IS present fails it too,
      # so this variable cannot outlive its reason.
      #
      # The offset is gone as a result, which is the cheap way to check this stayed true: the case
      # count no longer depends on what is on disk, so this job and a full local workspace now report
      # the SAME total. Measured 2026-09-07, both 577. A future divergence means some other suite has
      # started varying with the checkout.
      #
      # If this job ever checks out Service or BaseAppLib, drop that name from here — the suite will
      # tell you to.
      - name: test
        working-directory: repos/Lz
        env:
          LZ_TARGETS_COPIES_ABSENT: Service,BaseAppLib
        run: dotnet test Lz.slnx -c Debug --filter "Category!=Integration"
