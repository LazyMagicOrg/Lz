# CI gate for Lz. Runs the two suites this repo owns: the Cognito Custom-Auth trigger's pure
# decision core (node:test) and the Lz config/merge/validators + policy + smoke-probe logic (xUnit).
#
# WHY THIS LOOKS MORE INVOLVED THAN "dotnet test". Three facts, each of which broke this workflow
# before (it was disabled_manually on 2026-08-22 after ~10 red runs, and stayed dark for two weeks):
#
#  1. Lz.slnx deliberately includes ProjectTemplates/* so template contamination (dangling
#     ProjectReferences) is caught at build time. Seven of those templates PackageReference
#     LazyMagic.* — so "no LazyMagic build is needed", which the old header asserted, was false for
#     the solution even though it is true for Lz.Core/Lz.Aws alone.
#  2. LazyMagic is not on nuget.org (search API: zero hits). It is published to GitHub Packages under
#     LazyMagicOrg, which needs a token; the repo is public, so BUILDING it needs none. We build it,
#     which is also what service-ci.yml does for the same reason.
#  3. TeardownRedeployTests is a live AWS lifecycle drill. It is gated behind LZ_LIFECYCLE_ENABLE=1,
#     but its harness constructor walks up looking for a systemconfig.{sk}.{env}.yaml BEFORE that
#     guard runs — that file exists only inside a workspace, never in a standalone clone, so the
#     constructor throws here. It carries Category=Integration and is filtered out, matching the
#     convention service-ci.yml already uses.
#
# The whole recipe was verified against a clean clone before being committed: restore, both suites,
# 353/353.
name: lz-ci

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu, and deliberately: `lz` is a Windows developer CLI here (every
    # working copy is Windows, the build skill is PowerShell), and parts of the suite encode that on
    # purpose — DevEnvironmentGuardTests asserts on `C:\repos\_MagicPets\_Test_MagicPets`-shaped
    # paths because that is the shape the guard actually sees. An ubuntu run fails two of those
    # cases: `Path.GetFileName` does not treat `\` as a separator there, and `C:/Windows` is not
    # rooted, so an env token parses to null and a drive-letter path is not seen as escaping. Neither
    # is a production bug today, and rewriting a security guard's test data to satisfy a runner
    # choice would be the wrong way round. Free minutes on a public repo make the cost argument moot.
    #
    # The ubuntu run also surfaced a real off-Windows hole in CloneReposLogic.IsSafeRelativePath,
    # which FIXED it: a drive designator is now rejected explicitly rather than via Path.IsPathRooted
    # (aa732ce). Note the regression test for that deliberately asserts the extracted
    # HasDriveDesignator predicate, NOT the end-to-end guard — on this Windows runner IsPathRooted
    # rejects every drive form anyway, so an end-to-end assertion passes with or without the check
    # and would never catch its removal here.
    runs-on: windows-latest
    steps:
      # Lz and LazyMagic as SIBLINGS — the layout the NuGet.Config written below assumes, and the
      # same shape they have in a product workspace (repos/Lz + repos/LazyMagic).
      - uses: actions/checkout@v4
        with:
          path: Lz
      # Public repo: no token needed.
      #
      # ref: dev is REQUIRED, not a preference. LazyMagic's default branch is badly stale — main
      # declares Version 3.0.1 and test declares 3.0.10, while dev declares the 3.0.17 that
      # ProjectTemplates/Directory.Packages.props pins and that every workspace consumes. Checking
      # out the default branch produces a feed holding 3.0.1 and restore fails NU1102 ("Found 1
      # version(s) in LazyMagicLocal [ Nearest version: 3.0.1 ]"), which is exactly how this was
      # found: it passed against a local clone that happened to sit on dev, and failed on the runner.
      #
      # THE COUPLING THIS CREATES, so a future red run is diagnosable: the pins are EXACT, so the
      # moment LazyMagic dev bumps to 3.0.18 this gate goes red until those pins are updated. That
      # is a true signal rather than flakiness — the templates would genuinely no longer compile
      # against the framework the systems consume — but it will look like an unrelated failure to
      # whoever is changing Lz at the time.
      - uses: actions/checkout@v4
        with:
          repository: LazyMagicOrg/LazyMagic
          ref: dev
          path: LazyMagic

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cognito Custom-Auth trigger — the fail-closed / single-shot / constant-time decision core.
      # Path note: this lives under Lz.Aws/Auth/, NOT Lz.Aws/AppRunner/ — the 0.11.0 axis restructure
      # (40c5517) retired the AppRunner topology and moved it. Because a failing step aborts the job,
      # naming the old path silently took `dotnet test` below down with it.
      - run: node --test Lz/Lz.Aws/Auth/CognitoCustomAuth/custom-auth.test.mjs

      # Build ONLY the five service-side projects the templates pin, not LazyMagic.sln.
      #
      # Two reasons, and the second is not optional. (a) The whole solution also contains the
      # client-side projects (LazyMagic.OIDC.Base, LazyMagic.Client.ViewModels, BlazorTest.*), which
      # nothing here consumes. (b) Those projects pull ReactiveUI/Splat 19.3.1, whose author signing
      # certificate has been REVOKED. That was observed here as a hard NU3012 restore failure on a
      # Linux runner ("The author primary signature found a chain building issue: Revoked:
      # certificate revoked") before this job moved to windows-latest, where revocation checking
      # behaves differently. Building the five keeps that whole class of failure out of the gate
      # regardless of runner, and without weakening signature verification — the alternative,
      # NUGET_CERT_REVOCATION_MODE=offline, turns the check off globally.
      #
      # Per-project builds work because LazyMagic has a Directory.Build.props; Lz itself does not,
      # which is why IT must be built through the .slnx (MSB4019).
      - name: build LazyMagic service packages (the feed the templates restore from)
        shell: bash
        run: |
          for p in LazyMagic.Shared \
                   LazyMagic.Service.Shared \
                   LazyMagic.Service.Authorization \
                   LazyMagic.Service.DynamoDBRepo \
                   LazyMagic.Service.AwsLocalWebApiRoutingMiddleware; do
            dotnet build "LazyMagic/$p/$p.csproj" -c Debug
          done
          ls -1 LazyMagic/Packages/*.nupkg

      # CI-only, deliberately NOT committed to the repo. A NuGet.Config inside a sub-repo is a
      # documented hazard in this codebase: NuGet dedupes sources by resolved PATH and the nearest
      # config wins the NAME, so a sub-repo config can silently rename a feed out from under a
      # parent's packageSourceMapping. The repo therefore carries none, and CI writes exactly what
      # CI needs. <clear/> drops the runner's inherited sources so resolution is deterministic.
      - name: write the CI NuGet.Config
        working-directory: Lz
        shell: bash
        run: |
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="LazyMagicLocal" value="../LazyMagic/Packages" />
            </packageSources>
          </configuration>
          XML

      # Build via the SOLUTION — Lz.slnx sets SolutionDir; a bare-csproj build fails MSB4019.
      - name: test
        working-directory: Lz
        run: dotnet test Lz.slnx -c Debug --filter "Category!=Integration"
