# CI gate for Lz. Runs the two suites this repo owns: the Cognito Custom-Auth trigger's pure
# decision core (node:test) and the Lz config/merge/validators + policy + smoke-probe logic (xUnit).
#
# WHY THIS LOOKS MORE INVOLVED THAN "dotnet test". Three facts, each of which broke this workflow
# before (it was disabled_manually on 2026-08-22 after ~10 red runs, and stayed dark for two weeks):
#
#  1. Lz.slnx deliberately includes ProjectTemplates/* so template contamination (dangling
#     ProjectReferences) is caught at build time. Seven of those templates PackageReference
#     LazyMagic.* — so "no LazyMagic build is needed", which the old header asserted, was false for
#     the solution even though it is true for Lz.Core/Lz.Aws alone.
#  2. LazyMagic is not on nuget.org (search API: zero hits). It is published to GitHub Packages under
#     LazyMagicOrg, which needs a token; the repo is public, so BUILDING it needs none. We build it,
#     which is also what service-ci.yml does for the same reason.
#  3. TeardownRedeployTests is a live AWS lifecycle drill. It is gated behind LZ_LIFECYCLE_ENABLE=1,
#     but its harness constructor walks up looking for a systemconfig.{sk}.{env}.yaml BEFORE that
#     guard runs — that file exists only inside a workspace, never in a standalone clone, so the
#     constructor throws here. It carries Category=Integration and is filtered out, matching the
#     convention service-ci.yml already uses.
#
# The whole recipe was verified against a clean clone before being committed: restore, both suites,
# 353/353.
name: lz-ci

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest, not ubuntu, and deliberately: `lz` is a Windows developer CLI here (every
    # working copy is Windows, the build skill is PowerShell), and parts of the suite encode that on
    # purpose — DevEnvironmentGuardTests asserts on `C:\repos\_MagicPets\_Test_MagicPets`-shaped
    # paths because that is the shape the guard actually sees. An ubuntu run fails two of those
    # cases: `Path.GetFileName` does not treat `\` as a separator there, and `C:/Windows` is not
    # rooted, so an env token parses to null and a drive-letter path is not seen as escaping. Neither
    # is a production bug today, and rewriting a security guard's test data to satisfy a runner
    # choice would be the wrong way round. Free minutes on a public repo make the cost argument moot.
    #
    # The ubuntu run also surfaced a real off-Windows hole in CloneReposLogic.IsSafeRelativePath,
    # since fixed in aa732ce: a drive designator is now rejected explicitly rather than relying on
    # Path.IsPathRooted. Note the regression test for that deliberately asserts the extracted
    # HasDriveDesignator predicate, NOT the end-to-end guard — on this Windows runner IsPathRooted
    # rejects every drive form anyway, so an end-to-end assertion passes with or without the check
    # and would never catch its removal here.
    runs-on: windows-latest
    steps:
      # repos/Lz + repos/LazyMagic under a workspace root — the EXACT shape a product workspace
      # has, and that is load-bearing rather than cosmetic. The local lane (below) writes its
      # override at the workspace root, and ProjectTemplates/Directory.Packages.props imports it
      # three levels up. Checked out flat as Lz/ and LazyMagic/, that import resolves ABOVE the
      # runner root and silently finds nothing - restore still succeeds, on the stale committed
      # defaults. Keeping CI's layout identical to a developer's is what makes the same override
      # path correct in both.
      - uses: actions/checkout@v4
        with:
          path: repos/Lz
      # Public repo: no token needed.
      #
      # ref: dev is REQUIRED, not a preference — it is the branch every workspace consumes, and
      # the one the templates are validated against. main and test lag it.
      #
      # fetch-depth: 0 is equally REQUIRED. Since 2026-09-06 LazyMagic derives its version from
      # version.json plus COMMIT HEIGHT (Nerdbank.GitVersioning), and a depth-1 checkout has no
      # history to count. That case is at least LOUD — measured on a real depth-1 clone against the
      # pinned 3.10.94, NBGV throws "Shallow clone lacks the objects required to calculate version
      # height" and fails the build with MSB4018, so it can never quietly ship a wrong number.
      # The genuinely silent case is the one guarded below: no version.json at all.
      #
      # WHAT USED TO BE COUPLED HERE, and no longer is: the templates pinned LazyMagic at an exact
      # literal, so any bump reddened this gate until someone edited the pins. Under a derived
      # version that is unfixable rather than tedious — every LazyMagic commit changes the version,
      # so no committed literal can ever track it. The lane step below pins the templates at
      # whatever was actually built instead.
      - uses: actions/checkout@v4
        with:
          repository: LazyMagicOrg/LazyMagic
          ref: dev
          fetch-depth: 0
          path: repos/LazyMagic

      # THE FAILURE THIS CATCHES IS SILENT, WHICH IS WHY IT IS A STEP AND NOT A COMMENT.
      # We check out LazyMagic's REMOTE dev. If that branch does not carry version.json — it was
      # reverted, the derived-versioning work landed on main while dev stayed static, or this
      # workflow was pushed BEFORE the LazyMagic commit — then NBGV is not in the build at all.
      # There is no error: the old static <Version> is used, the lane writes exactly the versions
      # the templates already have committed, restore is satisfied, and this gate goes GREEN
      # having exercised none of the thing it exists to exercise. A green run cannot discriminate,
      # because the lane pins whatever was built and the outcome is byte-identical either way.
      #
      # Deliberately asserts PRESENCE, not a version number. Naming the expected version here
      # would reintroduce the committed literal this whole change exists to remove, and would need
      # editing every time ProjectTemplates/Directory.Packages.props moves.
      - name: the LazyMagic checkout must be the derived-version one
        shell: pwsh
        run: |
          if (-not (Test-Path repos/LazyMagic/version.json)) {
            throw "LazyMagic dev carries no version.json, so this run would build the old static version and prove nothing about the package lane. Push the LazyMagic derived-versioning commit first."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cognito Custom-Auth trigger — the fail-closed / single-shot / constant-time decision core.
      # Path note: this lives under Lz.Aws/Auth/, NOT Lz.Aws/AppRunner/ — the 0.11.0 axis restructure
      # (40c5517) retired the AppRunner topology and moved it. Because a failing step aborts the job,
      # naming the old path silently took `dotnet test` below down with it.
      - run: node --test repos/Lz/Lz.Aws/Auth/CognitoCustomAuth/custom-auth.test.mjs

      # Build ONLY the five service-side projects the templates pin, not LazyMagic.sln.
      #
      # Two reasons, and the second is not optional. (a) The whole solution also contains the
      # client-side projects (LazyMagic.OIDC.Base, LazyMagic.Client.ViewModels, BlazorTest.*), which
      # nothing here consumes. (b) Those projects pull ReactiveUI/Splat 19.3.1, whose author signing
      # certificate has been REVOKED. That was observed here as a hard NU3012 restore failure on a
      # Linux runner ("The author primary signature found a chain building issue: Revoked:
      # certificate revoked") before this job moved to windows-latest, where revocation checking
      # behaves differently. Building the five keeps that whole class of failure out of the gate
      # regardless of runner, and without weakening signature verification — the alternative,
      # NUGET_CERT_REVOCATION_MODE=offline, turns the check off globally.
      #
      # Per-project builds work because LazyMagic has a Directory.Build.props; Lz itself does not,
      # which is why IT must be built through the .slnx (MSB4019).
      - name: build LazyMagic service packages (the feed the templates restore from)
        shell: bash
        run: |
          for p in LazyMagic.Shared \
                   LazyMagic.Service.Shared \
                   LazyMagic.Service.Authorization \
                   LazyMagic.Service.DynamoDBRepo \
                   LazyMagic.Service.AwsLocalWebApiRoutingMiddleware; do
            dotnet build "repos/LazyMagic/$p/$p.csproj" -c Debug
          done
          ls -1 repos/LazyMagic/Packages/*.nupkg

      # CI-only, deliberately NOT committed, and at the WORKSPACE ROOT rather than inside Lz.
      # A NuGet.Config inside a sub-repo is a documented hazard in this codebase: NuGet dedupes
      # sources by resolved PATH and the nearest config wins the NAME, so a sub-repo config can
      # silently rename a feed out from under a parent's packageSourceMapping. Writing it at the
      # root is both the safe side of that hazard and where a real workspace keeps it — and the
      # lane tool below reads the feed list from this same file, so the tool and restore cannot
      # disagree about which feeds exist. <clear/> drops the runner's inherited sources.
      - name: write the CI NuGet.Config
        shell: bash
        run: |
          cat > NuGet.Config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="LazyMagicLocal" value="repos/LazyMagic/Packages" />
            </packageSources>
          </configuration>
          XML

      # Pin the templates at the LazyMagic just built, instead of at a literal that cannot track a
      # derived version. This is the same local lane a developer's build.ps1 uses, driven the same
      # way: the tool scans the feeds named in the NuGet.Config above and writes one property per
      # package id into Packages.Local.props at the workspace root, which
      # ProjectTemplates/Directory.Packages.props imports beneath its committed defaults.
      #
      # Run from SOURCE rather than as the `lz` CLI: `lz` resolves Lz.Cli out of repos/Lz/Packages,
      # which does not exist on a fresh runner. Lz.Cli can be run from source precisely because it
      # takes nothing from a first-party feed — only sibling ProjectReferences and System.CommandLine.
      #
      # -p:SolutionDir is mandatory, not tidiness: Lz's projects import
      # $(SolutionDir)CommonPackageHandling.targets and this repo has no Directory.Build.props to
      # supply it, so a per-project build fails MSB4019. The .slnx sets it, a bare csproj does not.
      #
      # The tool REFUSES to write an empty override, so a LazyMagic build that silently produced
      # nothing fails here, loudly, instead of falling through to the stale defaults and testing
      # the wrong framework.
      - name: pin the templates at the LazyMagic just built (local lane)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          dotnet run --project repos/Lz/Lz.Cli/Lz.Cli.csproj -c Debug "-p:SolutionDir=$root\repos\Lz\" -- packages mode local --root "$root"
          if ($LASTEXITCODE -ne 0) { throw "lane refresh failed - templates would restore stale pins" }
          Get-Content Packages.Local.props

      # Build via the SOLUTION — Lz.slnx sets SolutionDir; a bare-csproj build fails MSB4019.
      - name: test
        working-directory: repos/Lz
        run: dotnet test Lz.slnx -c Debug --filter "Category!=Integration"
